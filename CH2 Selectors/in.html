<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>CSS Selectors</h1>
    </header>
    <main>
        <article>
            <h2> Article 1</h2>
            <p id="first" class="gray"> this is my article one.<span class="highlight">Hola</span></p>
        </article>
        <article>
            <h2>
                Article 2
            </h2>
            <p id="second"> this is my article two. <span class="highlight">Hola</span></p>
        </article>
        <article>
            <h2>
                Article 3
            </h2>
            <p class="gray"> this is my article three.<span class="highlight">Hola</span></p>
        </article>
    </main> 
</body>
</html>
